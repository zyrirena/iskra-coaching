<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Graduation Invitation</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@400;600&family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500&display=swap" rel="stylesheet">
<style>
:root{--green:#006633;--green-deep:#003a1d;--gold:#ffcc33;--gold-deep:#c9a227;--ivory:#fbf7ec;--ink:#27352c;
  --serif:'Cormorant Garamond',Georgia,'Times New Roman',serif;--caps:'Cinzel','Trajan Pro',Georgia,serif}
*{box-sizing:border-box;margin:0;padding:0}
body{min-height:100vh;min-height:100dvh;display:flex;align-items:center;justify-content:center;padding:24px 16px;
  font-family:var(--serif);color:var(--ink);
  background:radial-gradient(1200px 700px at 50% 30%,#0a7a41 0%,var(--green) 40%,var(--green-deep) 100%) fixed}
body::before{content:"";position:fixed;inset:0;pointer-events:none;
  background-image:repeating-linear-gradient(45deg,rgba(255,204,51,.05) 0 1px,transparent 1px 22px),repeating-linear-gradient(-45deg,rgba(255,204,51,.05) 0 1px,transparent 1px 22px)}
.card{position:relative;width:min(100%,440px);text-align:center;padding:44px clamp(24px,7vw,48px) 40px;background:var(--ivory);
  border-radius:4px;box-shadow:0 30px 80px rgba(0,0,0,.55),0 0 0 1px rgba(201,162,39,.6)}
.card::before{content:"";position:absolute;inset:10px;border:1.5px solid var(--gold-deep);pointer-events:none}
.card::after{content:"";position:absolute;inset:16px;border:.5px solid var(--gold-deep);opacity:.7;pointer-events:none}
.seal{width:112px;height:112px;display:block;margin:0 auto 22px;border-radius:50%;background:var(--ivory);padding:4px;
  box-shadow:0 0 0 2px var(--gold-deep),0 10px 24px rgba(0,0,0,.25)}
.eyebrow{font-family:var(--caps);letter-spacing:.3em;text-transform:uppercase;font-size:12px;color:var(--gold-deep)}
h1{font-family:var(--caps);font-weight:600;color:var(--green);letter-spacing:.14em;text-transform:uppercase;font-size:clamp(17px,4.6vw,21px);margin:12px 0 10px}
p.lead{font-style:italic;font-size:19px;line-height:1.5;color:#41524a}
form{margin-top:26px}
label{display:block;font-family:var(--caps);letter-spacing:.26em;text-transform:uppercase;font-size:10.5px;color:var(--gold-deep);margin-bottom:9px}
input{width:100%;font:500 18px var(--serif);text-align:center;letter-spacing:.06em;padding:13px 14px;color:var(--ink);
  background:#fff;border:1px solid var(--gold-deep);border-radius:2px;outline:none}
input:focus{box-shadow:0 0 0 3px rgba(0,102,51,.22);border-color:var(--green)}
button{margin-top:16px;width:100%;font-family:var(--caps);letter-spacing:.22em;text-transform:uppercase;font-size:11.5px;
  padding:15px 22px;border-radius:2px;cursor:pointer;border:1px solid var(--green);background:var(--green);color:var(--gold)}
button:hover{background:var(--green-deep)}
button:disabled{opacity:.7;cursor:wait}
button:focus-visible{outline:2px solid var(--gold-deep);outline-offset:3px}
.msg{min-height:24px;margin-top:14px;font-style:italic;font-size:17px;color:#8a2b2b}
.fine{margin-top:6px;font-size:15.5px;font-style:italic;color:#6b7a71}
.shake{animation:shake .4s}
@keyframes shake{20%,60%{transform:translateX(-7px)}40%,80%{transform:translateX(7px)}}
@media (prefers-reduced-motion:reduce){.shake{animation:none}}
</style>
</head>

const $ = id => document.getElementById(id);
const b64 = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
async function decrypt(pw){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pw), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(P.salt), iterations:P.iter, hash:'SHA-256'},
    base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const buf = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(P.iv)}, key, b64(P.data));
  return new TextDecoder().decode(buf);
}
if (!(window.crypto && crypto.subtle)){
  $('msg').textContent = 'This browser cannot open the invitation. Please open the file in Chrome, Safari, Edge or Firefox.';
  $('go').disabled = true;
}
$('f').addEventListener('submit', async function(e){
  e.preventDefault();
  const pw = $('pw').value.trim().toLowerCase();
  if (!pw) return;
  $('go').disabled = true; $('go').textContent = 'Opening\u2026'; $('msg').textContent = '';
  try {
    const html = await decrypt(pw);
    document.open(); document.write(html); document.close();
  } catch (err) {
    $('go').disabled = false; $('go').textContent = 'Open Invitation';
    $('msg').textContent = 'That password doesn\u2019t look right. Please try again.';
    $('card').classList.remove('shake'); void $('card').offsetWidth; $('card').classList.add('shake');
    $('pw').select();
  }
});
</script>
